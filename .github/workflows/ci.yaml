name: Java wallet CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wallet_test
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet-local-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/wallet_test
      TEST_DB_USERNAME: wallet
      TEST_DB_PASSWORD: wallet-local-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B verify
      - run: docker build -t wallet-transfer:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
